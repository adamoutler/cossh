name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Parse Compose Metrics
        run: |
          grep -i "unstable" app/build/compose_metrics/*-classes.txt || echo "No unstable classes"

      - name: Run Lint
        run: ./gradlew lint

      - name: Build Release (ProGuard Check)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/release.keystore -alias cossh_release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=test"
          ./gradlew assembleRelease

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4

      - name: Install dependencies
        run: pip install paramiko

      - name: Run Tests and Coverage
        run: ./gradlew cleanTest testDebugUnitTest jacocoTestReport | tee build-test.log

      - name: SonarCloud Scan & Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar -Dsonar.projectKey=adamoutler_cossh -Dsonar.organization=adamoutler -Dsonar.host.url=https://sonarcloud.io -Dsonar.qualitygate.wait=true -Dsonar.c.file.suffixes=- -Dsonar.cpp.file.suffixes=- -Dsonar.objc.file.suffixes=-

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Echo Test Results for Reality Checker
        run: |
          echo "==== TEST RESULTS FOR REALITY CHECKER ===="
          grep -i "PASSED" build-test.log

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run MobSF Static Analysis
        uses: MobSF/mobsfscan@main
        with:
          args: '. --sarif --output results.sarif'
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
