name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Parse Compose Metrics
        run: |
          grep -i "unstable" app/build/compose_metrics/*-classes.txt || echo "No unstable classes"

      - name: Run Lint
        run: ./gradlew lint

      - name: Build Release (ProGuard Check)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/release.keystore -alias cossh_release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=test"
          ./gradlew assembleRelease

      - name: Submit Dependency Graph
        uses: gradle/actions/dependency-submission@v4

      - name: Install dependencies
        run: pip install paramiko

      - name: Run Tests
        run: ./gradlew cleanTest testDebugUnitTest | tee build-test.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Echo Test Results for Reality Checker
        run: |
          echo "==== TEST RESULTS FOR REALITY CHECKER ===="
          grep -i "PASSED" build-test.log

  security_scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: .
      - name: Run MobSF Analysis
        uses: MobSF/mobsf-action@main
        with:
          file_name: app-debug.apk
