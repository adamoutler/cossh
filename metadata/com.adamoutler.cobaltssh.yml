AutoName: CoSSH

Summary: Cobalt SSH - Hardened Android SSH client with StrongBox key isolation

Description: |-
  CoSSH (Cobalt SSH) is a native, highly secure Android SSH terminal client
  engineered to replace legacy applications. It features hardware-backed StrongBox
  and TEE key isolation, ASN.1 Key Attestation, post-quantum hybrid key exchange
  (sntrup761x25519-sha512@openssh.com), DNSSEC SSHFP Zero-TOFU verification,
  FIDO2/WebAuthn hardware key integration, and reproducible deterministic builds.

